name: Release

# A v* tag builds the binaries and publishes them as a GitHub release.
# A manual run builds the same files as a workflow artifact only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - run: go vet ./... && go test ./...

      - name: Build
        run: |
          ver=$(go run ./cmd/dk version | cut -d' ' -f2)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $ver in cmd/dk/main.go" >&2
            exit 1
          fi
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=dk_${ver}_${os}_${arch}
            bin=dk
            [ "$os" = windows ] && bin=dk.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "build/$name/$bin" ./cmd/dk
            cp LICENSE.md README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd "build/$name" && zip -q "../../dist/$name.zip" "$bin" LICENSE.md README.md)
            else
              tar -C "build/$name" -czf "dist/$name.tar.gz" "$bin" LICENSE.md README.md
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
